<form method="get" action="{{ request.path }}" style="margin-bottom:24px;">
<div id="report-dates" style="display:flex; align-items:center; gap:18px;">
    {% if session['role'] == 'admin' %}
        <label for="from_date"><strong>From Date:</strong></label>
        <input type="date" id="from_date" name="from_date"
            value="{{ from_date if from_date else current_date }}"
            style="padding: 6px 12px; border-radius: 4px; border: 1px solid #ccc;">
        <label for="to_date"><strong>To Date:</strong></label>
        <input type="date" id="to_date" name="to_date"
            value="{{ to_date if to_date else current_date }}"
            style="padding: 6px 12px; border-radius: 4px; border: 1px solid #ccc;">
        <button type="submit" class="no-print" style="background:#1976d2; color:#fff; border:none; padding:8px 16px; border-radius:4px;">Fetch Report</button>
    {% else %}
        <label for="from_date" style="font-weight: bold; color: #333;">From Date:</label>
        <input type="date" id="from_date" name="from_date"
            value="{{ current_date.strftime('%Y-%m-%d') if current_date else '' }}"
            min="{{ (current_date - timedelta(days=29)).strftime('%Y-%m-%d') if current_date else '' }}"
            max="{{ current_date.strftime('%Y-%m-%d') if current_date else '' }}"
            style="padding: 6px 12px; border-radius: 4px; border: 1px solid #ccc;">
        <label for="to_date" style="font-weight: bold; color: #333;">To Date:</label>
        <input type="date" id="to_date" name="to_date"
            value="{{ current_date.strftime('%Y-%m-%d') if current_date else '' }}"
            min="{{ (current_date - timedelta(days=29)).strftime('%Y-%m-%d') if current_date else '' }}"
            max="{{ current_date.strftime('%Y-%m-%d') if current_date else '' }}"
            style="padding: 6px 12px; border-radius: 4px; border: 1px solid #ccc;">
        <button type="submit" class="no-print" style="background:#007bff; color:#fff; border:none; border-radius:4px; padding:8px 18px; font-weight:bold; cursor:pointer;">Filter</button>
    {% endif %}
</div>
</form>
