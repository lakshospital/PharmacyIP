{% extends "base.html" %}
{% block content %}
<div class="container-fluid" style="max-width:100vw; margin:auto; padding:32px;">
    <h2 style="color:#1976d2; margin-bottom:24px; text-align:center;">Product Group Master</h2>
    <form method="post" class="card shadow-sm" style="padding:24px; margin-bottom:32px; border-radius:16px; background:#fff; max-width:500px; margin:auto;">
        <div class="mb-3">
            <label class="form-label">Group Name</label>
            <input type="text" name="group_name" class="form-control" required value="{{ group_to_edit.GroupName if group_to_edit else '' }}">
            {% if group_to_edit %}
                <input type="hidden" name="group_id" value="{{ group_to_edit.id }}">
            {% endif %}
        </div>
        <div class="d-flex justify-content-end mt-4">
            {% if group_to_edit %}
                <button type="submit" name="action" value="edit" class="btn btn-primary px-4 py-2">Update Group</button>
                <a href="{{ url_for('product_group_master_bp.product_group_master') }}" class="btn btn-secondary px-4 py-2 ms-2">Cancel</a>
            {% else %}
                <button type="submit" name="action" value="add" class="btn btn-primary px-4 py-2">Add Group</button>
            {% endif %}
        </div>
    </form>
    <div class="card shadow-sm" style="border-radius:16px; background:#fff; max-width:600px; margin:auto;">
        <div style="overflow-x:auto; overflow-y:auto; max-height:400px;">
            <table id="groupTable" class="table table-striped table-bordered align-middle" style="min-width:400px;">
                <thead class="table-light">
                    <tr>
                        <th>Group Name</th>
                        <th style="text-align:center;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for group in groups %}
                    <tr>
                        <td>{{ group.GroupName }}</td>
                        <td style="text-align:center;">
                            <a href="{{ url_for('product_group_master_bp.product_group_master', edit=group.id) }}" class="btn btn-sm btn-warning mx-1">Edit</a>
                            <form method="post" style="display:inline;">
                                <input type="hidden" name="group_id" value="{{ group.id }}">
                                <button type="submit" name="action" value="delete" class="btn btn-sm btn-danger mx-1" onclick="return confirm('Delete this group?');">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script>
$(document).ready(function() {
    $('#groupTable').DataTable({
        scrollX: true,
        scrollY: 300,
        paging: true,
        responsive: true
    });
});
</script>
{% endblock %}
